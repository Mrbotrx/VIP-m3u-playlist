<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>KB TV PRO | Live TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b12;--panel:#101725;--card:#141d2b;--line:#273448;
  --accent:#ff3030;--text:#fff;--muted:#8d99ad;--radius:14px;
}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  -webkit-text-size-adjust:100%;
}
.hidden{display:none !important}

/* Top bar */
.topbar{
  position:sticky;top:0;z-index:20;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:rgba(16,23,37,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.logo{font-size:22px;font-weight:900;color:var(--accent);letter-spacing:.5px}
.logo span{color:#fff}
.live-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;color:#ff6b6b;
  background:rgba(255,48,48,.12);padding:5px 10px;border-radius:999px;
}
.live-pill i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}

/* Layout */
.layout{
  flex:1;width:100%;max-width:1400px;margin:0 auto;
  padding:12px;display:grid;gap:16px;
}

/* Player */
.player-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.video-wrap{position:relative;background:#000;aspect-ratio:16/9}
video{width:100%;height:100%;display:block;background:#000}
.overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:20px;color:var(--muted);
  background:radial-gradient(circle at center,#151d2e,#000);
}
.overlay.hidden{display:none}
.now{display:flex;align-items:center;gap:10px;padding:12px}
.now-text{flex:1;min-width:0}
.now-text h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-text p{font-size:12px;color:var(--muted);margin-top:2px}
.status{padding:0 14px 14px;font-size:13px;color:var(--muted);min-height:20px}
.status.error{color:#ff8a8a}
.retry{
  margin-left:8px;background:var(--accent);color:#fff;border:0;
  border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;
}

/* Buttons & inputs */
.btn-icon{
  width:44px;height:44px;flex:none;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:#fff;
  font-size:20px;cursor:pointer;display:grid;place-items:center;
}
.btn-icon:disabled{opacity:.5;cursor:default}
.btn-icon:active{transform:scale(.96)}
@media (hover:hover){ .btn-icon:hover{border-color:var(--accent)} }
button:focus-visible,.ch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px}
.search{position:relative;grid-column:1/-1}
.search input{
  width:100%;height:46px;padding:0 44px 0 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:#fff;
  font:inherit;outline:none;
}
.search input:focus{border-color:var(--accent)}
.search .clear{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border:0;background:none;color:var(--muted);
  font-size:16px;cursor:pointer;
}
select{
  height:44px;padding:0 12px;border-radius:12px;min-width:0;
  border:1px solid var(--line);background:var(--card);color:#fff;
  font:inherit;outline:none;
}
select:focus{border-color:var(--accent)}

/* Channel list */
.list-head{
  display:flex;justify-content:space-between;align-items:center;
  margin:14px 2px 10px;font-size:13px;color:var(--muted);
}
.channel-list{display:flex;flex-direction:column;gap:8px}
.ch{
  display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;
  gap:12px;width:100%;min-height:68px;padding:8px 12px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  color:inherit;font:inherit;text-align:left;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.ch:active{transform:scale(.99)}
.ch.active{border-color:var(--accent);background:#1a1420}
@media (hover:hover){ .ch:hover{border-color:#3b4a66} }
.thumb{
  width:52px;height:52px;border-radius:10px;background:#fff;
  object-fit:contain;padding:5px;display:block;
}
.thumb.fallback{
  display:grid;place-items:center;padding:0;
  background:#1f2a3d;color:#c9d3e3;font-weight:800;font-size:14px;
}
.ch-text{min-width:0}
.ch-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-group{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{
  display:none;font-size:11px;font-weight:700;color:#fff;
  background:var(--accent);padding:4px 8px;border-radius:999px;
}
.ch.active .tag{display:inline-block}
.empty{text-align:center;color:var(--muted);padding:30px 0}

footer{
  margin-top:auto;text-align:center;padding:18px;
  color:#6b778b;font-size:12px;
}

/* Desktop */
@media (min-width:960px){
  .layout{
    grid-template-columns:minmax(0,1fr) 380px;
    align-items:start;padding:24px;gap:24px;
  }
  .now-text h1{font-size:22px}
  .list-col{
    position:sticky;top:80px;display:flex;flex-direction:column;
    max-height:calc(100vh - 104px);
  }
  .channel-list{overflow-y:auto;flex:1;min-height:0;padding-right:4px}
  .ch{min-height:64px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">KB <span>TV PRO</span></div>
  <div class="live-pill"><i></i>LIVE TV</div>
</header>

<main class="layout">

  <section class="player-col">
    <div class="player-card">
      <div class="video-wrap">
        <video id="video" controls playsinline preload="metadata"></video>
        <div id="overlay" class="overlay">Pick a channel below to start watching.</div>
      </div>
      <div class="now">
        <button id="prev" class="btn-icon" aria-label="Previous channel" disabled>‹</button>
        <div class="now-text">
          <h1 id="nowName">Select a channel</h1>
          <p id="nowGroup">—</p>
        </div>
        <button id="next" class="btn-icon" aria-label="Next channel" disabled>›</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">Loading playlist…</div>
    </div>
  </section>

  <section class="list-col">
    <div class="toolbar">
      <div class="search">
        <input id="search" type="search" placeholder="Search channels" autocomplete="off" aria-label="Search channels">
        <button id="clear" class="clear hidden" aria-label="Clear search">✕</button>
      </div>
      <select id="category" aria-label="Filter by category">
        <option value="all">All categories</option>
      </select>
      <button id="refresh" class="btn-icon" aria-label="Refresh playlist">↻</button>
    </div>
    <div class="list-head"><span id="count">0 channels</span></div>
    <div id="channels" class="channel-list"></div>
  </section>

</main>

<footer>
  KB TV PRO © 2026<br>Powered by KB CYBER TEAM
</footer>

<script>
const PLAYLIST_URL =
  "https://raw.githubusercontent.com/Mrbotrx/VIP-m3u-playlist/refs/heads/main/Vip%20playlists/vip_kbpro.m3u8";

const $ = id => document.getElementById(id);
const video = $("video");
const overlay = $("overlay");
const statusEl = $("status");
const listEl = $("channels");
const searchEl = $("search");
const clearBtn = $("clear");
const catEl = $("category");
const countEl = $("count");
const refreshBtn = $("refresh");
const prevBtn = $("prev");
const nextBtn = $("next");

let channels = [];
let visible = [];      // indexes into channels
let current = -1;      // index of playing channel
let currentUrl = "";   // remembered so the index survives a refresh
let hls = null;

/* ---------- Status ---------- */
function setStatus(msg, { error = false, retry = null } = {}) {
  statusEl.className = "status" + (error ? " error" : "");
  statusEl.textContent = msg;
  if (retry) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "retry";
    b.textContent = "Retry";
    b.onclick = () => retry();
    statusEl.append(" ", b);
  }
}

/* ---------- Playlist parsing ---------- */
function attr(line, name) {
  const m = line.match(new RegExp(name + '="([^"]*)"'));
  return m ? m[1].trim() : "";
}

function parsePlaylist(text) {
  const out = [];
  let pending = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith("#EXTINF")) {
      const comma = line.lastIndexOf(",");
      pending = {
        name: comma >= 0 ? line.slice(comma + 1).trim() : "Unknown",
        logo: attr(line, "tvg-logo"),
        group: attr(line, "group-title") || "Uncategorized",
        url: ""
      };
    } else if (!line.startsWith("#") && pending) {
      pending.url = line;
      if (pending.name && pending.url) out.push(pending);
      pending = null;
    }
  }
  return out;
}

/* ---------- Thumbnails ---------- */
function makeInitials(name) {
  const s = document.createElement("span");
  s.className = "thumb fallback";
  s.textContent = name.split(/\s+/).filter(Boolean).slice(0, 2)
    .map(w => w[0]).join("").toUpperCase() || "TV";
  return s;
}

function makeThumb(ch) {
  if (!ch.logo) return makeInitials(ch.name);
  const img = document.createElement("img");
  img.className = "thumb";
  img.alt = "";
  img.loading = "lazy";
  img.decoding = "async";
  img.onerror = () => img.replaceWith(makeInitials(ch.name));
  img.src = ch.logo;
  return img;
}

/* ---------- Categories, filtering, rendering ---------- */
function buildCategories() {
  const prev = catEl.value;
  const cats = [...new Set(channels.map(c => c.group))]
    .sort((a, b) => a.localeCompare(b));
  catEl.replaceChildren(
    new Option("All categories", "all"),
    ...cats.map(c => new Option(c, c))
  );
  catEl.value = (prev === "all" || cats.includes(prev)) ? prev : "all";
}

function applyFilter() {
  const q = searchEl.value.trim().toLowerCase();
  const cat = catEl.value;
  visible = [];
  channels.forEach((c, i) => {
    if (cat !== "all" && c.group !== cat) return;
    if (q && !c.name.toLowerCase().includes(q) && !c.group.toLowerCase().includes(q)) return;
    visible.push(i);
  });
}

function render() {
  applyFilter();
  clearBtn.classList.toggle("hidden", !searchEl.value);
  countEl.textContent = `${visible.length} ${visible.length === 1 ? "channel" : "channels"}`;
  prevBtn.disabled = nextBtn.disabled = !visible.length;

  const frag = document.createDocumentFragment();

  if (!visible.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = channels.length
      ? "No channels match your search."
      : "No channels yet.";
    frag.append(p);
  }

  for (const i of visible) {
    const ch = channels[i];

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "ch" + (i === current ? " active" : "");
    btn.dataset.index = i;

    const text = document.createElement("div");
    text.className = "ch-text";

    const name = document.createElement("div");
    name.className = "ch-name";
    name.textContent = ch.name;

    const grp = document.createElement("div");
    grp.className = "ch-group";
    grp.textContent = ch.group;

    text.append(name, grp);

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "Playing";

    btn.append(makeThumb(ch), text, tag);
    frag.append(btn);
  }

  listEl.replaceChildren(frag);
}

function markActive() {
  listEl.querySelectorAll(".ch.active").forEach(b => b.classList.remove("active"));
  const btn = listEl.querySelector(`.ch[data-index="${current}"]`);
  if (btn) btn.classList.add("active");
}

/* ---------- Playback ---------- */
function play(i) {
  if (i < 0 || i >= channels.length) return;
  current = i;
  const ch = channels[i];
  currentUrl = ch.url;
  $("nowName").textContent = ch.name;
  $("nowGroup").textContent = ch.group;
  overlay.classList.add("hidden");
  markActive();
  loadStream(ch);
}

function step(dir) {
  if (!visible.length) return;
  const pos = visible.indexOf(current);
  let next;
  if (pos < 0) next = dir > 0 ? visible[0] : visible[visible.length - 1];
  else next = visible[(pos + dir + visible.length) % visible.length];
  play(next);
}

function stopStream() {
  if (hls) { hls.destroy(); hls = null; }
  video.onerror = null;
  video.pause();
  video.removeAttribute("src");
  video.load();
}

function failStream(ch, msg) {
  stopStream();
  setStatus(msg, { error: true, retry: () => loadStream(ch) });
}

function loadStream(ch) {
  stopStream();
  setStatus(`Connecting to ${ch.name}…`);

  const url = ch.url;
  const isHls = /\.m3u8(\?|#|$)/i.test(url);

  if (!isHls) {
    video.onerror = () => failStream(ch, `${ch.name} couldn't be played.`);
    video.src = url;
    video.play()
      .then(() => setStatus(`Playing ${ch.name}`))
      .catch(() => setStatus(`Ready. Press play to start ${ch.name}.`));
    return;
  }

  if (window.Hls && Hls.isSupported()) {
    const player = new Hls({ enableWorker: true, lowLatencyMode: true });
    hls = player;

    player.on(Hls.Events.MANIFEST_PARSED, () => {
      setStatus(`Playing ${ch.name}`);
      video.play().catch(() => {});
    });

    player.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal || hls !== player) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        player.recoverMediaError();
        return;
      }
      failStream(ch, `${ch.name} is offline or blocked right now.`);
    });

    player.loadSource(url);
    player.attachMedia(video);

  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.onerror = () => failStream(ch, `${ch.name} couldn't be played.`);
    video.src = url;
    video.play().catch(() => {});
    setStatus(`Playing ${ch.name}`);

  } else {
    failStream(ch, window.Hls
      ? "This browser can't play HLS streams."
      : "The player library didn't load. Check your connection.");
  }
}

/* ---------- Loading ---------- */
async function loadPlaylist() {
  refreshBtn.disabled = true;
  setStatus("Loading playlist…");
  try {
    const res = await fetch(PLAYLIST_URL, { cache: "no-cache" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const parsed = parsePlaylist(await res.text());
    if (!parsed.length) throw new Error("no channels found");

    channels = parsed;
    current = currentUrl ? channels.findIndex(c => c.url === currentUrl) : -1;
    buildCategories();
    render();
    setStatus(`${channels.length} channels loaded. Pick one to start watching.`);
  } catch (err) {
    setStatus(`Couldn't load the channel list (${err.message}). Check your connection.`,
      { error: true, retry: loadPlaylist });
  } finally {
    refreshBtn.disabled = false;
  }
}

/* ---------- Events ---------- */
listEl.addEventListener("click", e => {
  const btn = e.target.closest(".ch");
  if (btn) play(Number(btn.dataset.index));
});
searchEl.addEventListener("input", render);
clearBtn.addEventListener("click", () => {
  searchEl.value = "";
  render();
  searchEl.focus();
});
catEl.addEventListener("change", render);
refreshBtn.addEventListener("click", loadPlaylist);
prevBtn.addEventListener("click", () => step(-1));
nextBtn.addEventListener("click", () => step(1));

loadPlaylist();
</script>
</body>
</html>
