<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<title>KB TV PRO | Live TV</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#000;
--card:#0a130b;
--line:#143014;
--accent:#39ff14;
--danger:#ff5252;
--muted:#6f8a6f;
--name-font:"Share Tech Mono",monospace;
--logo-font:"Orbitron",sans-serif;
--notice-h:30px;
--top-h:56px;
}

body{
background:var(--bg);
color:#fff;
font:15px/1.4 system-ui,sans-serif;
min-height:100vh;
display:flex;
flex-direction:column;
-webkit-tap-highlight-color:transparent;
}

.hidden{display:none!important}

button:focus-visible,
input:focus-visible,
select:focus-visible{
outline:2px solid var(--accent);
outline-offset:2px;
}

/* HEADER */

.topbar{
position:sticky;
top:0;
z-index:30;
height:var(--top-h);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
background:rgba(0,0,0,.95);
border-bottom:2px solid var(--accent);
}

.logo{
font-family:var(--logo-font);
font-size:20px;
font-weight:900;
color:var(--accent);
}

.logo span{color:#fff}

.live-pill{
display:flex;
align-items:center;
gap:6px;
font-size:11px;
color:#ff6b6b;
border:1px solid #663333;
padding:5px 10px;
border-radius:30px;
}

.live-pill i{
width:7px;
height:7px;
background:red;
border-radius:50%;
animation:pulse 1.4s infinite;
}

@keyframes pulse{50%{opacity:.2}}

/* NOTICE */

.notice{
position:sticky;
top:var(--top-h);
z-index:29;
height:var(--notice-h);
display:flex;
align-items:center;
overflow:hidden;
background:#0b1a0b;
border-bottom:1px solid var(--line);
color:var(--accent);
font-family:var(--name-font);
font-size:13px;
}

.notice-track{
display:inline-flex;
white-space:nowrap;
animation:marquee var(--speed,18s) linear infinite;
}

.notice-track span{padding-right:60px}

@keyframes marquee{
from{transform:translateX(0)}
to{transform:translateX(-50%)}
}

.notice.static .notice-track{
animation:none;
padding-left:14px;
}

/* LAYOUT */

.layout{
flex:1;
width:100%;
max-width:1400px;
margin:auto;
display:flex;
flex-direction:column;
}

.player-col{
position:sticky;
top:calc(var(--top-h) + var(--notice-h));
z-index:25;
background:#000;
box-shadow:0 6px 16px #000;
}

/* VIDEO */

.player-card{background:#000}

.video-wrap{
position:relative;
background:#000;
aspect-ratio:16/9;
}

video{
width:100%;
height:100%;
display:block;
background:#000;
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
color:var(--muted);
background:radial-gradient(circle,#0d1a0d,#000);
}

.overlay.hidden{display:none}

/* NOW PLAYING */

.now{
display:flex;
align-items:center;
gap:10px;
padding:10px 12px;
background:#000;
border-bottom:2px solid var(--accent);
}

.on-badge{
font-family:var(--logo-font);
font-size:11px;
color:var(--muted);
border:1px solid #2a3a2a;
border-radius:6px;
padding:6px 8px;
}

.on-badge.live{
color:var(--accent);
border-color:var(--accent);
}

.now-text{flex:1;min-width:0}

.now-text h1{
font-family:var(--logo-font);
font-size:15px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.now-text p{
font-family:var(--name-font);
font-size:11px;
color:var(--muted);
margin-top:2px;
}

.icon-btn{
flex:none;
width:40px;
height:40px;
border-radius:10px;
cursor:pointer;
border:1px solid var(--line);
background:var(--card);
color:#fff;
font-size:18px;
display:grid;
place-items:center;
}

.icon-btn:disabled{
opacity:.35;
cursor:default;
}

.icon-btn.fav-on{color:#ffd400}

/* STATUS */

.status{
padding:8px 12px;
font-family:var(--name-font);
font-size:12px;
color:var(--muted);
min-height:30px;
display:flex;
align-items:center;
flex-wrap:wrap;
gap:6px;
}

.status.error{color:#ff8a8a}

.retry{
background:var(--danger);
color:#fff;
border:0;
border-radius:8px;
padding:5px 12px;
cursor:pointer;
}

/* TOOLBAR */

.toolbar{
display:flex;
gap:8px;
padding:12px 12px 0;
}

.search{position:relative;flex:1;min-width:0}

.search input{
width:100%;
height:44px;
padding:0 40px 0 14px;
border-radius:12px;
border:1px solid var(--line);
background:var(--card);
color:#fff;
font:inherit;
}

.search input::placeholder{color:var(--muted)}

.search .clear{
position:absolute;
right:2px;
top:50%;
transform:translateY(-50%);
width:38px;
height:38px;
border:0;
background:none;
color:var(--muted);
cursor:pointer;
}

select{
display:none;
height:44px;
padding:0 12px;
border-radius:12px;
border:1px solid var(--line);
background:var(--card);
color:#fff;
}

/* CATEGORY */

.chips{
display:flex;
gap:8px;
overflow-x:auto;
padding:12px 12px 4px;
scrollbar-width:none;
}

.chips::-webkit-scrollbar{display:none}

.chip{
flex:none;
font-family:var(--name-font);
font-size:12px;
color:var(--muted);
background:var(--card);
border:1px solid var(--line);
padding:7px 12px;
border-radius:999px;
cursor:pointer;
white-space:nowrap;
}

.chip.active{
color:#000;
background:var(--accent);
border-color:var(--accent);
}

/* CHANNEL LIST */

.list-head{
display:flex;
justify-content:space-between;
padding:10px 14px 6px;
font-family:var(--name-font);
font-size:12px;
color:var(--muted);
}

.channel-list{
display:flex;
flex-direction:column;
padding-bottom:90px;
}

.ch{
display:flex;
align-items:center;
gap:6px;
border-bottom:1px solid var(--line);
}

.ch.active{
background:linear-gradient(90deg,rgba(57,255,20,.14),transparent);
box-shadow:inset 3px 0 var(--accent);
}

.ch-main{
flex:1;
min-width:0;
display:grid;
grid-template-columns:60px minmax(0,1fr);
align-items:center;
gap:14px;
padding:12px 4px 12px 14px;
background:none;
border:0;
color:inherit;
font:inherit;
text-align:left;
cursor:pointer;
}

.thumb{
width:60px;
height:60px;
border-radius:12px;
background:#fff;
object-fit:contain;
padding:6px;
}

.thumb.fallback{
display:grid;
place-items:center;
background:#0f1d11;
color:var(--accent);
font-family:var(--logo-font);
font-weight:900;
font-size:16px;
}

.ch-name{
font-family:var(--name-font);
font-size:16px;
color:var(--accent);
text-transform:uppercase;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.ch-group{
font-family:var(--name-font);
font-size:12px;
color:var(--muted);
margin-top:4px;
}

.tag{
display:none;
font-size:10px;
font-weight:700;
color:#000;
background:var(--accent);
padding:3px 7px;
border-radius:999px;
margin-top:4px;
}

.ch.active .tag{display:inline-block}

.star{
flex:none;
width:44px;
height:44px;
margin-right:6px;
border:0;
background:none;
color:#3b4a3b;
font-size:20px;
cursor:pointer;
}

.star.on{color:#ffd400}

.empty{
text-align:center;
color:var(--muted);
padding:40px 16px;
}

/* TOP BUTTON */

.top-fab{
position:fixed;
right:16px;
bottom:22px;
z-index:40;
width:54px;
height:54px;
border-radius:50%;
border:2px solid var(--accent);
background:#000;
color:var(--accent);
font-size:20px;
cursor:pointer;
opacity:0;
pointer-events:none;
transition:.25s;
}

.top-fab.show{
opacity:1;
pointer-events:auto;
}

footer{
text-align:center;
padding:18px;
color:#4f604f;
font-size:11px;
}

/* DESKTOP */

@media(min-width:960px){

:root{
--bg:#080b12;
--card:#141d2b;
--line:#273448;
--accent:#ff3030;
--muted:#8d99ad;
--name-font:inherit;
--logo-font:inherit;
--top-h:65px;
--notice-h:36px;
}

.topbar{
padding:0 5%;
background:#101725;
}

.logo{font-size:23px}

.notice{
position:static;
background:#101725;
color:#ffb3b3;
padding:0 5%;
font-family:inherit;
}

.layout{
max-width:1450px;
display:grid;
grid-template-columns:minmax(0,1fr) 380px;
align-items:start;
padding:24px;
gap:24px;
}

.player-col{
position:static;
box-shadow:none;
background:none;
}

.player-card{
background:#111827;
border:1px solid #263246;
border-radius:15px;
overflow:hidden;
}

.now{
background:none;
border:0;
padding:15px;
}

.now-text h1{
font-size:20px;
font-family:inherit;
}

.now-text p{font-family:inherit}

.on-badge{display:none}

.status{
background:none;
padding:0 15px 14px;
}

.toolbar{padding:0 0 4px}

.search input{height:46px}

select{display:block}

.chips{display:none}

.list-col{
position:sticky;
top:24px;
display:flex;
flex-direction:column;
max-height:calc(100vh - 48px);
}

.list-head{
font-family:inherit;
font-size:13px;
}

.channel-list{
overflow-y:auto;
flex:1;
min-height:0;
padding:0 4px;
}

.ch{
border:1px solid var(--line);
border-radius:12px;
margin-bottom:8px;
background:var(--card);
}

.ch.active{
background:#1a1420;
border-color:var(--accent);
box-shadow:none;
}

.ch-main{
grid-template-columns:52px minmax(0,1fr);
padding:8px 4px 8px 10px;
gap:12px;
}

.thumb{
width:52px;
height:52px;
}

.ch-name{
font-family:inherit;
font-size:15px;
color:#fff;
text-transform:none;
}

.ch-group{
font-family:inherit;
font-size:12px;
}

.tag{color:#fff}

.star{width:36px;height:36px}

.top-fab{display:none}

footer{font-family:inherit}

}
</style>
</head>

<body>

<header class="topbar">
<div class="logo">KB <span>TV PRO</span></div>
<div class="live-pill"><i></i> LIVE TV</div>
</header>

<div id="notice" class="notice hidden" role="note">
<div class="notice-track" id="noticeTrack"></div>
</div>

<main class="layout">

<section class="player-col">

<div class="player-card">

<div class="video-wrap">

<video id="video"
controls
playsinline
preload="metadata"></video>

<div id="overlay" class="overlay">
Pick a channel below to start watching
</div>

</div>

<div class="now">

<span id="onBadge" class="on-badge">OFF</span>

<div class="now-text">
<h1 id="nowName">Select a channel</h1>
<p id="nowGroup">—</p>
</div>

<button id="favNow" class="icon-btn" disabled>☆</button>
<button id="prev" class="icon-btn" disabled>‹</button>
<button id="next" class="icon-btn" disabled>›</button>

</div>

<div id="status" class="status" role="status">
Loading playlists…
</div>

</div>
</section>

<section class="list-col">

<div class="toolbar">

<div class="search">
<input id="search"
type="search"
placeholder="Search channels…"
autocomplete="off">

<button id="clear" class="clear hidden">✕</button>
</div>

<select id="category">
<option value="all">All categories</option>
</select>

<button id="refresh" class="icon-btn">↻</button>

</div>

<div id="chips" class="chips"></div>

<div class="list-head">
<span id="count">0 channels</span>
<span id="shown"></span>
</div>

<div id="channels" class="channel-list"></div>

</section>
</main>

<footer>
KB TV PRO © 2026 · Powered by KB CYBER TEAM
</footer>

<button id="topBtn" class="top-fab">▲</button>

<script>

/* =========================================
   CONFIGURATION
========================================= */

const NOTICE_TEXT = `KBPRO TV NOTICE
📺 আমাদের সার্ভারে আপডেট চলছে। কিছু চ্যানেল সাময়িকভাবে বন্ধ থাকতে পারে।
অনুগ্রহ করে অপেক্ষা করুন। খুব শীঘ্রই সব চ্যানেল চালু হবে।
❤️ KBPRO TV TEAM`;

const NOTICE_SPEED_SEC = 18;
const NOTICE_SCROLL = true;

const PLAYLIST_URLS = [

"https://raw.githubusercontent.com/Mrbotrx/BD-OTT-PLAYLIST/main/india/India_vip.m3u",

"https://raw.githubusercontent.com/Mrbotrx/VIP-m3u-playlist/refs/heads/main/Vip%20playlists/vip_kbpro.m3u8"

];

const FAV_KEY = "kbtv-favs";
const LAST_KEY = "kbtv-last";
const FAV_CAT = "__fav__";

const $ = id => document.getElementById(id);

const video = $("video");
const overlay = $("overlay");
const statusEl = $("status");
const listEl = $("channels");
const searchEl = $("search");
const clearBtn = $("clear");
const catEl = $("category");
const chipsEl = $("chips");
const countEl = $("count");
const shownEl = $("shown");
const refreshBtn = $("refresh");
const prevBtn = $("prev");
const nextBtn = $("next");
const favNowBtn = $("favNow");
const topBtn = $("topBtn");
const onBadge = $("onBadge");

let channels = [];
let visible = [];
let current = -1;
let hls = null;
let favs = loadFavs();
let playbackToken = 0;

/* =========================================
   NOTICE
========================================= */

function setupNotice(){

const bar = $("notice");
const track = $("noticeTrack");

const text = NOTICE_TEXT.trim();

if(!text){
bar.classList.add("hidden");
return;
}

bar.classList.remove("hidden");

track.replaceChildren(
...[0,1].map(()=>{
const s = document.createElement("span");
s.textContent = text;
return s;
})
);

track.style.setProperty(
"--speed",
NOTICE_SPEED_SEC+"s"
);

bar.classList.toggle(
"static",
!NOTICE_SCROLL
);

}

/* =========================================
   STORAGE
========================================= */

function loadFavs(){

try{
return new Set(
JSON.parse(localStorage.getItem(FAV_KEY)||"[]")
);
}catch{
return new Set();
}

}

function saveFavs(){

try{
localStorage.setItem(
FAV_KEY,
JSON.stringify([...favs])
);
}catch{}

}

function saveLast(url){

try{
localStorage.setItem(LAST_KEY,url);
}catch{}

}

function readLast(){

try{
return localStorage.getItem(LAST_KEY)||"";
}catch{
return "";
}

}

/* =========================================
   STATUS
========================================= */

function setStatus(msg,options={}){

statusEl.className =
"status"+(options.error?" error":"");

statusEl.textContent = msg;

if(options.retry){

const b = document.createElement("button");

b.className = "retry";
b.textContent = "Retry";
b.type = "button";

b.onclick = options.retry;

statusEl.append(b);

}

}

/* =========================================
   CATEGORY DETECTION
========================================= */

function detectCategory(name,group){

const value = (name+" "+group).toLowerCase();

const rules = [

["Sports",/\bsports?\b|cricket|football|soccer|tennis|espn|star sports|sony sports|ten sports|sportz|willow|fox sports/],

["Movies",/movie|cinema|film|pictures|hbo|zee cinema|star gold|sony max|colors cineplex/],

["Music",/music|mtv|9xm|b4u music|zoom|vh1|mastiii|songs|melody/],

["News",/news|breaking|cnn|bbc news|ndtv|republic|times now|aaj tak|abp news|zee news/],

["Kids",/kids|cartoon|nick|pogo|disney|hungama|baby tv|cartoon network/],

["Entertainment",/entertainment|zee tv|star plus|colors tv|sony sab|sony entertainment|sun tv|gemini tv|vijay tv|jio|jalsa/],

["Documentary",/discovery|history|nat geo|national geographic|animal planet|wild/],

["Lifestyle",/food|travel|lifestyle|fashion|good times/]

];

for(const [category,regex] of rules){

if(regex.test(value)) return category;

}

return group && group !== "Uncategorized"
? group
: "Others";

}

/* =========================================
   PLAYLIST PARSER
========================================= */

function attr(line,name){

const escaped = name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

const m = line.match(
new RegExp(escaped+'="([^"]*)"',"i")
);

return m ? m[1].trim() : "";

}

function parsePlaylist(text){

const out = [];

let pending = null;

for(const raw of text.split(/\r?\n/)){

const line = raw.trim();

if(!line) continue;

if(line.startsWith("#EXTINF")){

const comma = line.lastIndexOf(",");

const name = comma >= 0
? line.slice(comma+1).trim()
: attr(line,"tvg-name") || "Unknown";

const originalGroup =
attr(line,"group-title") || "Uncategorized";

pending = {

name: name || attr(line,"tvg-name") || "Unknown",

logo: attr(line,"tvg-logo"),

group: detectCategory(name,originalGroup),

url: ""

};

}else if(!line.startsWith("#") && pending){

if(/^https?:\/\//i.test(line)){

pending.url = line;

out.push(pending);

}

pending = null;

}

}

return out;

}

/* =========================================
   THUMBNAILS
========================================= */

function initials(name){

const s = document.createElement("span");

s.className = "thumb fallback";

s.textContent =
name.split(/\s+/)
.filter(Boolean)
.slice(0,2)
.map(w=>w[0])
.join("")
.toUpperCase() || "TV";

return s;

}

function thumb(ch){

if(!ch.logo) return initials(ch.name);

const img = document.createElement("img");

img.className = "thumb";
img.alt = ch.name;
img.loading = "lazy";
img.decoding = "async";

img.onerror = ()=>img.replaceWith(initials(ch.name));

img.src = ch.logo;

return img;

}

/* =========================================
   CATEGORIES
========================================= */

function buildCategories(){

const previous = catEl.value;

const groups = [
...new Set(channels.map(c=>c.group))
].sort((a,b)=>a.localeCompare(b));

const cats = [
["all","All"],
[FAV_CAT,"★ Favourites"],
...groups.map(g=>[g,g])
];

catEl.replaceChildren(
...cats.map(([v,l])=>new Option(l,v))
);

catEl.value =
cats.some(([v])=>v===previous)
? previous
: "all";

chipsEl.replaceChildren(
...cats.map(([v,l])=>{

const b = document.createElement("button");

b.type = "button";
b.className = "chip";
b.dataset.cat = v;
b.textContent = l;

return b;

})
);

syncChips();

}

function syncChips(){

chipsEl.querySelectorAll(".chip")
.forEach(c=>{

c.classList.toggle(
"active",
c.dataset.cat===catEl.value
);

});

}

/* =========================================
   FILTER
========================================= */

function applyFilter(){

const q = searchEl.value.trim().toLowerCase();

const cat = catEl.value;

visible = [];

channels.forEach((c,i)=>{

if(cat===FAV_CAT && !favs.has(c.url)) return;

if(cat!=="all" && cat!==FAV_CAT && c.group!==cat) return;

if(
q &&
!c.name.toLowerCase().includes(q) &&
!c.group.toLowerCase().includes(q)
)return;

visible.push(i);

});

}

/* =========================================
   RENDER
========================================= */

function render(){

applyFilter();

syncChips();

clearBtn.classList.toggle(
"hidden",
!searchEl.value
);

countEl.textContent =
`${visible.length} channels`;

shownEl.textContent =
favs.size ? `★ ${favs.size} saved` : "";

prevBtn.disabled = !visible.length;
nextBtn.disabled = !visible.length;

const frag = document.createDocumentFragment();

if(!visible.length){

const p = document.createElement("p");

p.className = "empty";

p.textContent =
!channels.length
? "No channels available."
: catEl.value===FAV_CAT
? "No favourites yet."
: "No channels match your search.";

frag.append(p);

}

for(const i of visible){

const ch = channels[i];

const isFav = favs.has(ch.url);

const row = document.createElement("div");

row.className =
"ch"+(i===current?" active":"");

const main = document.createElement("button");

main.type = "button";
main.className = "ch-main";
main.dataset.index = i;

const text = document.createElement("div");

text.style.minWidth = "0";

const name = document.createElement("div");

name.className = "ch-name";
name.textContent = ch.name;

const grp = document.createElement("div");

grp.className = "ch-group";
grp.textContent = ch.group;

const tag = document.createElement("span");

tag.className = "tag";
tag.textContent = "● Playing";

text.append(name,grp,tag);

main.append(thumb(ch),text);

const star = document.createElement("button");

star.type = "button";
star.className = "star"+(isFav?" on":"");
star.dataset.fav = i;
star.textContent = isFav?"★":"☆";

star.setAttribute(
"aria-label",
isFav?"Remove favourite":"Add favourite"
);

row.append(main,star);

frag.append(row);

}

listEl.replaceChildren(frag);

updateNowFav();

}

/* =========================================
   FAVOURITES
========================================= */

function updateNowFav(){

const ch = channels[current];

const on = !!ch && favs.has(ch.url);

favNowBtn.textContent = on?"★":"☆";

favNowBtn.classList.toggle("fav-on",on);

favNowBtn.disabled = !ch;

}

function toggleFav(i){

const ch = channels[i];

if(!ch)return;

if(favs.has(ch.url)){
favs.delete(ch.url);
}else{
favs.add(ch.url);
}

saveFavs();

render();

}

/* =========================================
   PLAYER
========================================= */

function setNow(i){

$("nowName").textContent = channels[i].name;

$("nowGroup").textContent = channels[i].group;

}

function setLive(on){

onBadge.textContent = on?"ON":"OFF";

onBadge.classList.toggle("live",on);

}

function stopStream(){

playbackToken++;

if(hls){

hls.destroy();

hls = null;

}

video.onerror = null;

video.pause();

video.removeAttribute("src");

video.load();

}

function failStream(ch,msg,token){

if(token!==playbackToken)return;

stopStream();

setLive(false);

setStatus(msg,{
error:true,
retry:()=>loadStream(ch)
});

}

function loadStream(ch){

stopStream();

const token = playbackToken;

setLive(false);

setStatus(`Connecting to ${ch.name}…`);

const url = ch.url;

const isHls = /\.m3u8(?:[?#]|$)/i.test(url);

if(!isHls){

video.onerror = ()=>failStream(
ch,
`${ch.name} couldn't be played.`,
token
);

video.src = url;

video.play()
.then(()=>{

if(token!==playbackToken)return;

setLive(true);

setStatus(`Playing ${ch.name}`);

})
.catch(()=>{

if(token===playbackToken){

setStatus(
`Ready. Press play to start ${ch.name}.`
);

}

});

return;

}

if(window.Hls && Hls.isSupported()){

const player = new Hls({

enableWorker:true,
lowLatencyMode:true,
maxBufferLength:30

});

hls = player;

player.on(Hls.Events.MANIFEST_PARSED,()=>{

if(token!==playbackToken)return;

setStatus(`Playing ${ch.name}`);

video.play().catch(()=>{

setStatus(`Press play to watch ${ch.name}.`);

});

});

player.on(Hls.Events.ERROR,(_,data)=>{

if(token!==playbackToken || !data.fatal)return;

if(data.type===Hls.ErrorTypes.MEDIA_ERROR){

player.recoverMediaError();

return;

}

failStream(
ch,
`${ch.name} is offline or blocked.`,
token
);

});

player.loadSource(url);

player.attachMedia(video);

}else if(video.canPlayType("application/vnd.apple.mpegurl")){

video.onerror = ()=>failStream(
ch,
`${ch.name} couldn't be played.`,
token
);

video.src = url;

video.play().then(()=>{

if(token!==playbackToken)return;

setLive(true);

setStatus(`Playing ${ch.name}`);

}).catch(()=>{

if(token===playbackToken){

setStatus(`Press play to watch ${ch.name}.`);

}

});

}else{

failStream(
ch,
"Your browser does not support HLS playback.",
token
);

}

}

function play(i){

if(i<0 || i>=channels.length)return;

current = i;

const ch = channels[i];

setNow(i);

overlay.classList.add("hidden");

saveLast(ch.url);

render();

loadStream(ch);

}

function step(dir){

if(!visible.length)return;

const pos = visible.indexOf(current);

let next;

if(pos<0){

next = dir>0
? visible[0]
: visible[visible.length-1];

}else{

next = visible[
(pos+dir+visible.length)%visible.length
];

}

play(next);

}

/* =========================================
   MULTI PLAYLIST LOADER
========================================= */

async function fetchPlaylist(url){

const controller = new AbortController();

const timeout = setTimeout(
()=>controller.abort(),
20000
);

try{

const response = await fetch(url,{

cache:"no-cache",
signal:controller.signal

});

if(!response.ok){

throw new Error(`HTTP ${response.status}`);

}

const text = await response.text();

if(!text.includes("#EXTINF")){

throw new Error("Invalid M3U playlist");

}

return parsePlaylist(text);

}finally{

clearTimeout(timeout);

}

}

async function loadPlaylist(){

refreshBtn.disabled = true;

setStatus("Loading playlists…");

try{

const results = await Promise.allSettled(

PLAYLIST_URLS.map(url=>fetchPlaylist(url))

);

let merged = [];

let successful = 0;

results.forEach(result=>{

if(result.status==="fulfilled"){

merged.push(...result.value);

successful++;

}else{

console.warn(
"Playlist failed:",
result.reason
);

}

});

if(!merged.length){

throw new Error(
"No channels found in available playlists."
);

}

/* REMOVE DUPLICATES */

const unique = new Map();

merged.forEach(channel=>{

if(!channel.url)return;

const key = channel.url.trim();

if(!unique.has(key)){

unique.set(key,channel);

}

});

const parsed = [...unique.values()];

if(!parsed.length){

throw new Error("No valid channels found.");

}

/* PRESERVE CURRENT CHANNEL */

const keepUrl =
current>=0 && channels[current]
? channels[current].url
: "";

channels = parsed;

current = keepUrl
? channels.findIndex(c=>c.url===keepUrl)
: -1;

/* RESTORE LAST CHANNEL */

if(current<0){

const last = readLast();

const idx = channels.findIndex(
c=>c.url===last
);

if(idx>=0){

current = idx;

setNow(idx);

overlay.classList.add("hidden");

}else{

$("nowName").textContent = "Select a channel";

$("nowGroup").textContent = "—";

overlay.classList.remove("hidden");

}

}

/* UPDATE UI */

buildCategories();

render();

setStatus(
`${channels.length} channels loaded. `+
`${successful}/${PLAYLIST_URLS.length} playlists connected.`
);

}catch(err){

console.error("Playlist error:",err);

setStatus(
`Couldn't load playlists: ${err.message}`,
{
error:true,
retry:loadPlaylist
}
);

}finally{

refreshBtn.disabled = false;

}

}

/* =========================================
   EVENTS
========================================= */

listEl.addEventListener("click",e=>{

const star = e.target.closest(".star");

if(star){

toggleFav(Number(star.dataset.fav));

return;

}

const main = e.target.closest(".ch-main");

if(main){

play(Number(main.dataset.index));

}

});

chipsEl.addEventListener("click",e=>{

const chip = e.target.closest(".chip");

if(!chip)return;

catEl.value = chip.dataset.cat;

render();

});

searchEl.addEventListener("input",render);

clearBtn.addEventListener("click",()=>{

searchEl.value = "";

render();

searchEl.focus();

});

catEl.addEventListener("change",render);

refreshBtn.addEventListener("click",loadPlaylist);

prevBtn.addEventListener("click",()=>step(-1));

nextBtn.addEventListener("click",()=>step(1));

favNowBtn.addEventListener("click",()=>{

if(current>=0)toggleFav(current);

});

window.addEventListener("scroll",()=>{

topBtn.classList.toggle(
"show",
window.scrollY>400
);

},{passive:true});

topBtn.addEventListener("click",()=>{

window.scrollTo({
top:0,
behavior:"smooth"
});

});

/* MEDIA SESSION */

if("mediaSession" in navigator){

try{

navigator.mediaSession.setActionHandler(
"previoustrack",
()=>step(-1)
);

navigator.mediaSession.setActionHandler(
"nexttrack",
()=>step(1)
);

}catch{}

}

/* INITIALIZE */

setupNotice();

loadPlaylist();

</script>
