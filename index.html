<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>KB TV PRO | Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#080b12;color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh;
}
header{
 height:65px;padding:0 5%;
 display:flex;align-items:center;
 justify-content:space-between;
 background:#101725;
 position:sticky;top:0;z-index:10;
 border-bottom:1px solid #252d3c;
}
.logo{font-size:23px;font-weight:900;color:#ff3030}
.logo span{color:white}
.live{color:#ff4444;font-size:12px}
.container{max-width:1450px;margin:auto;padding:20px}
.player-box{
 background:#111827;border-radius:15px;
 overflow:hidden;border:1px solid #263246;
}
.player-title{
 padding:15px;display:flex;
 justify-content:space-between;align-items:center;
}
video{
 width:100%;aspect-ratio:16/9;
 background:#000;display:block;
}
.controls{
 display:flex;gap:10px;
 flex-wrap:wrap;margin:18px 0;
}
input,select{
 background:#151e2d;color:white;
 border:1px solid #344054;
 border-radius:9px;padding:13px;
 outline:none;
}
input{flex:1;min-width:180px}
select{min-width:150px}
.section-title{
 font-size:19px;margin:22px 0 15px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
 gap:13px;
}
.channel{
 background:#141d2b;
 border:1px solid #273448;
 border-radius:12px;
 padding:13px 8px;
 text-align:center;cursor:pointer;
 transition:.2s;
}
.channel:hover{
 border-color:#ff3030;
 transform:translateY(-3px);
}
.channel.active{border:1px solid #ff3030}
.channel img{
 width:65px;height:65px;
 object-fit:contain;
 margin-bottom:10px;
}
.channel h4{
 font-size:13px;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}
.badge{
 color:#ff4141;font-size:10px;
 margin-top:7px;
}
.status{
 color:#aab5c7;font-size:13px;
 padding:10px 0;
}
footer{
 text-align:center;padding:25px;
 color:#778397;font-size:12px;
}
button{
 background:#e52e3d;color:white;
 border:0;padding:12px 18px;
 border-radius:8px;cursor:pointer;
}
button:hover{background:#b91c2c}
a{color:white;text-decoration:none}
@media(max-width:600px){
 .container{padding:12px}
 header{padding:0 15px}
 .grid{grid-template-columns:repeat(3,1fr);gap:8px}
 .channel{padding:10px 4px}
 .channel img{width:48px;height:48px}
 .channel h4{font-size:11px}
}
</style>
</head>

<body>

<header>
 <div class="logo">KB <span>TV PRO</span></div>
 <div class="live">● LIVE TV</div>
</header>

<main class="container">

 <div class="player-box">
  <div class="player-title">
   <h3 id="playing">Select a Channel</h3>
   <span class="live">● LIVE</span>
  </div>
  <video id="video" controls playsinline></video>
 </div>

 <div class="controls">
  <input id="search" placeholder="Search channels...">
  <select id="category">
   <option value="all">All Categories</option>
  </select>
  <button onclick="loadPlaylist()">↻ Refresh</button>
 </div>

 <div class="status" id="status">Loading playlist...</div>

 <h3 class="section-title">📺 All Channels</h3>
 <div class="grid" id="channels"></div>

</main>

<footer>
 KB TV PRO © 2026<br>
 Powered by KB CYBER TEAM
</footer>

<script>

const PLAYLIST =
"https://raw.githubusercontent.com/Mrbotrx/VIP-m3u-playlist/refs/heads/main/Vip%20playlists/vip_kbpro.m3u8";

const video = document.getElementById("video");
const channelBox = document.getElementById("channels");
const statusBox = document.getElementById("status");

let channels = [];
let hls = null;

function getAttribute(line,name){
 const regex = new RegExp(name+'="([^"]*)"');
 const match = line.match(regex);
 return match ? match[1] : "";
}

function parsePlaylist(text){

 const lines = text.split(/\r?\n/);
 const result = [];

 let current = null;

 for(const raw of lines){

  const line = raw.trim();

  if(line.startsWith("#EXTINF:")){

   const comma = line.lastIndexOf(",");

   current = {
    name: comma >= 0 ? line.substring(comma+1).trim() : "Unknown",
    logo: getAttribute(line,"tvg-logo"),
    group: getAttribute(line,"group-title") || "Uncategorized",
    url: ""
   };

  }

  else if(line && !line.startsWith("#") && current){

   current.url = line;

   if(current.name && current.url){
    result.push(current);
   }

   current = null;
  }
 }

 return result;
}

async function loadPlaylist(){

 statusBox.textContent = "Loading playlist...";
 channelBox.innerHTML = "";

 try{

  const response = await fetch(PLAYLIST,{cache:"no-cache"});

  if(!response.ok) throw new Error("Playlist HTTP "+response.status);

  const text = await response.text();

  channels = parsePlaylist(text);

  if(!channels.length)
   throw new Error("No channels found");

  createCategories();
  renderChannels();

  statusBox.textContent =
   channels.length+" playlist entries loaded successfully.";

 }catch(error){

  statusBox.textContent =
   "Playlist loading failed: "+error.message+
   " | Check internet connection or playlist access.";

 }

}

function createCategories(){

 const select = document.getElementById("category");

 select.innerHTML = '<option value="all">All Categories</option>';

 const categories = [...new Set(
  channels.map(c=>c.group)
 )].sort();

 categories.forEach(cat=>{

  const option = document.createElement("option");
  option.value = cat;
  option.textContent = cat;

  select.appendChild(option);

 });

}

function renderChannels(){

 const query = document.getElementById("search").value.toLowerCase();
 const selected = document.getElementById("category").value;

 channelBox.innerHTML = "";

 const filtered = channels.filter(c=>{

  const matchName = c.name.toLowerCase().includes(query);
  const matchGroup = c.group.toLowerCase().includes(query);

  const matchCategory =
   selected === "all" || c.group === selected;

  return (matchName || matchGroup) && matchCategory;

 });

 filtered.forEach(channel=>{

  const card = document.createElement("div");
  card.className = "channel";

  const img = document.createElement("img");
  img.src = channel.logo || "";
  img.alt = channel.name;
  img.loading = "lazy";

  img.onerror = ()=>{
   img.src = "https://placehold.co/100x100/151e2d/ffffff?text=TV";
  };

  const name = document.createElement("h4");
  name.textContent = channel.name;

  const badge = document.createElement("div");
  badge.className = "badge";
  badge.textContent = channel.group;

  card.append(img,name,badge);

  card.onclick = ()=>{
   document.querySelectorAll(".channel")
    .forEach(x=>x.classList.remove("active"));

   card.classList.add("active");
   playChannel(channel);
  };

  channelBox.appendChild(card);

 });

 if(!filtered.length){
  channelBox.innerHTML =
   '<p class="status">No channels found.</p>';
 }

}

function playChannel(channel){

 document.getElementById("playing").textContent =
  channel.name;

 if(hls){
  hls.destroy();
  hls = null;
 }

 video.pause();
 video.removeAttribute("src");
 video.load();

 const url = channel.url;

 if(url.toLowerCase().includes(".m3u8")){

  if(Hls.isSupported()){

   hls = new Hls({
    enableWorker:true,
    lowLatencyMode:true
   });

   hls.loadSource(url);
   hls.attachMedia(video);

   hls.on(Hls.Events.MANIFEST_PARSED,()=>{
    video.play().catch(()=>{});
   });

   hls.on(Hls.Events.ERROR,(event,data)=>{
    if(data.fatal){
     statusBox.textContent =
      "Stream error: "+channel.name+
      ". This stream may be unavailable or blocked.";
    }
   });

  }else if(video.canPlayType("application/vnd.apple.mpegurl")){

   video.src = url;
   video.play().catch(()=>{});

  }else{

   statusBox.textContent =
    "This browser does not support HLS playback.";

  }

 }else{

  video.src = url;
  video.play().catch(()=>{});

 }

}

document.getElementById("search")
 .addEventListener("input",renderChannels);

document.getElementById("category")
 .addEventListener("change",renderChannels);

loadPlaylist();

</script>
</body>
</html>
