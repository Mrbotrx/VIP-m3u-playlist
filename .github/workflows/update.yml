name: Working M3U Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3u-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Debug Secrets
        env:
          SRC_JSON_1: ${{ secrets.SRC_JSON_1 }}
          SRC_JSON_2: ${{ secrets.SRC_JSON_2 }}
          SRC_M3U_1: ${{ secrets.SRC_M3U_1 }}
          SRC_M3U_2: ${{ secrets.SRC_M3U_2 }}
        run: |
          echo "SRC_JSON_1 length: ${#SRC_JSON_1}"
          echo "SRC_JSON_2 length: ${#SRC_JSON_2}"
          echo "SRC_M3U_1 length: ${#SRC_M3U_1}"
          echo "SRC_M3U_2 length: ${#SRC_M3U_2}"

      - name: Generate M3U
        env:
          SRC_JSON_1: ${{ secrets.SRC_JSON_1 }}
          SRC_JSON_2: ${{ secrets.SRC_JSON_2 }}
          SRC_M3U_1: ${{ secrets.SRC_M3U_1 }}
          SRC_M3U_2: ${{ secrets.SRC_M3U_2 }}
        run: python convert.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Vip playlists/vip_kbpro.m3u8"
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Auto update - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
