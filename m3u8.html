<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KB TV PRO | Submit Information</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080d19;
    color: white;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 650px;
    margin: 35px auto;
}

.header {
    text-align: center;
    margin-bottom: 28px;
}

.logo {
    width: 75px;
    height: 75px;
    margin: auto;
    display: grid;
    place-items: center;
    border-radius: 20px;
    background: linear-gradient(135deg,#00d9ff,#0066ff);
    font-size: 30px;
    font-weight: 900;
}

.header h1 {
    margin-top: 15px;
    font-size: 28px;
}

.header span {
    color: #00d9ff;
}

.header p {
    color: #9eabc0;
    margin-top: 12px;
    line-height: 1.7;
}

.card {
    background: #111b2d;
    border: 1px solid #263650;
    border-radius: 18px;
    padding: 27px;
    box-shadow: 0 15px 40px #0005;
}

.card h2 {
    color: #00d9ff;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 21px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 9px;
}

input,
textarea {
    width: 100%;
    padding: 15px;
    background: #091323;
    border: 1px solid #35445c;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    outline: none;
    font-family: Arial;
}

input:focus,
textarea:focus {
    border-color: #00d9ff;
}

textarea {
    min-height: 125px;
    resize: vertical;
}

input::placeholder,
textarea::placeholder {
    color: #78869a;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg,#006aff,#00d9ff);
    color: white;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#status {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 9px;
    line-height: 1.6;
    font-size: 14px;
    text-align: center;
}

.success {
    display: block !important;
    background: #073d2b;
    color: #65ffb6;
}

.error {
    display: block !important;
    background: #481b25;
    color: #ff9da9;
}

.footer {
    text-align: center;
    color: #9eabc0;
    padding: 30px 10px;
    line-height: 2;
    font-size: 13px;
}

.footer strong {
    color: #00d9ff;
}

.footer a {
    color: #00d9ff;
    text-decoration: none;
}

.social {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 12px;
}

.social a {
    padding: 10px 17px;
    background: #172943;
    border-radius: 8px;
}

.hp {
    position: absolute;
    left: -9999px;
}

@media(max-width:480px) {
    .card {
        padding: 20px;
    }

    .header h1 {
        font-size: 24px;
    }
}

</style>

</head>

<body>

<div class="container">

    <header class="header">

        <div class="logo">KB</div>

        <h1>KB TV <span>PRO</span></h1>

        <p>
            Share Your Information<br>
            Help us improve our IPTV community.
        </p>

    </header>


    <main class="card">

        <h2>📩 Share Your Information</h2>

        <form id="submissionForm">

            <div class="form-group">

                <label>Your Name *</label>

                <input
                    type="text"
                    name="name"
                    placeholder="আপনার নাম লিখুন"
                    maxlength="100"
                    required
                >

            </div>


            <div class="form-group">

                <label>Subject *</label>

                <input
                    type="text"
                    name="subject"
                    placeholder="আপনি কী বিষয়ে জানাতে চান?"
                    maxlength="150"
                    required
                >

            </div>


            <div class="form-group">

                <label>Your Message / Information *</label>

                <textarea
                    name="message"
                    placeholder="আপনার তথ্য, লিংক, পরামর্শ অথবা বিস্তারিত লিখুন..."
                    maxlength="3000"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>Attachment / Links (Optional)</label>

                <textarea
                    name="links"
                    placeholder="M3U8, M3U, Logo অথবা Website Link যুক্ত করুন..."
                    maxlength="1000"
                ></textarea>

            </div>


            <!-- Anti-spam honeypot -->

            <div class="hp">
                <label>Website</label>
                <input type="text" name="website" tabindex="-1">
            </div>


            <button type="submit" id="submitBtn">
                SUBMIT INFORMATION 🚀
            </button>

            <div id="status"></div>

        </form>

    </main>


    <footer class="footer">

        <p>
            Made by <strong>KALLYAN BISWAS</strong>
        </p>

        <div class="social">

            <a href="https://www.facebook.com/kallyan.biswas.29"
               target="_blank" rel="noopener noreferrer">
                Facebook
            </a>

            <a href="https://t.me/iptvlinksm3u8"
               target="_blank" rel="noopener noreferrer">
                Telegram
            </a>

        </div>

        <br>

        © 2026 KB TV PRO. All Rights Reserved.

    </footer>

</div>


<script>

const WEBHOOK_URL =
"https://api.bots.business/v1/bots/3011400/new-webhook?&command=%2Freceive-submission&public_user_token=f7e56b10451621b473ca292ddc99efa5&user_id=41029675";


const form = document.getElementById("submissionForm");

const button = document.getElementById("submitBtn");

const statusBox = document.getElementById("status");


function showStatus(message, type) {

    statusBox.textContent = message;

    statusBox.className = type;

}


form.addEventListener("submit", async function(e) {

    e.preventDefault();

    if (!form.reportValidity()) return;

    if (WEBHOOK_URL === "YOUR_BOT_BUSINESS_WEBHOOK_URL") {

        showStatus("Please configure the Webhook URL.", "error");

        return;
    }

    const fd = new FormData(form);

    const data = {

        name: fd.get("name").trim(),

        subject: fd.get("subject").trim(),

        message: fd.get("message").trim(),

        links: fd.get("links").trim(),

        website: fd.get("website")

    };


    if (!data.name || !data.subject || !data.message) {

        showStatus("Please complete all required fields.", "error");

        return;

    }


    button.disabled = true;

    button.textContent = "SUBMITTING...";


    try {

        const response = await fetch(WEBHOOK_URL, {

            method: "POST",

            headers: {
                "Content-Type": "text/plain;charset=UTF-8"
            },

            body: JSON.stringify(data)

        });


        if (!response.ok) {

            throw new Error("Submission server error.");

        }


        const result = await response.json();


        if (!result.success) {

            throw new Error(result.message || "Submission failed.");

        }


        showStatus(
            "✅ Information submitted successfully! Thank you for supporting KB TV PRO.",
            "success"
        );

        form.reset();


    } catch(error) {

        showStatus(
            "❌ Submission failed. Check your connection or Webhook configuration. " + error.message,
            "error"
        );

    } finally {

        button.disabled = false;

        button.textContent = "SUBMIT INFORMATION 🚀";

    }

});

</script>

</body>
</html>
